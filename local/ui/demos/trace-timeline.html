<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollerskate Local UI · Trace Timeline</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #161921;
      --surface-2: #1e212b;
      --text: #e7eaef;
      --text-secondary: #9aa3b2;
      --border: #2a2e3a;
      --primary: #60a5fa;
      --primary-soft: rgba(96, 165, 250, 0.12);
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.12);
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.12);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --muted: #6b7280;
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      font-size: 13px;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-soft);
    }

    .runtime-bar {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .runtime-bar span strong { color: var(--text); }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1px;
      background: var(--border);
      min-height: calc(100vh - 57px);
    }

    .sidebar {
      background: var(--surface);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .subscription-row {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .subscription-row:hover { border-color: var(--primary); }
    .subscription-row.active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .row-id {
      font-size: 11px;
      color: var(--text-secondary);
      word-break: break-all;
    }

    .row-title { font-weight: 600; margin-bottom: 2px; }
    .row-meta { color: var(--text-secondary); font-size: 12px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge.active { background: var(--success-soft); color: var(--success); border-color: rgba(52,211,153,0.25); }
    .badge.paused { background: rgba(107,114,128,0.15); color: var(--muted); border-color: rgba(107,114,128,0.25); }
    .badge.triggered { background: var(--warning-soft); color: var(--warning); border-color: rgba(251,191,36,0.25); }
    .badge.running { background: var(--primary-soft); color: var(--primary); border-color: rgba(96,165,250,0.25); }
    .badge.completed { background: var(--success-soft); color: var(--success); border-color: rgba(52,211,153,0.25); }
    .badge.failed { background: var(--danger-soft); color: var(--danger); border-color: rgba(248,113,113,0.25); }
    .badge.unknown { background: var(--warning-soft); color: var(--warning); border: 1px dashed var(--warning); }
    .badge.cancelled { background: rgba(107,114,128,0.15); color: var(--muted); border-color: rgba(107,114,128,0.25); }
    .badge.expired { background: rgba(107,114,128,0.15); color: var(--muted); border-color: rgba(107,114,128,0.25); }
    .badge.revoked { background: var(--danger-soft); color: var(--danger); border-color: rgba(248,113,113,0.25); }

    .main {
      background: var(--bg);
      padding: 24px;
      overflow-y: auto;
    }

    .empty {
      color: var(--text-secondary);
      text-align: center;
      padding: 100px 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .panel-subtitle { color: var(--text-secondary); }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover { background: var(--surface); border-color: var(--primary); }
    button.primary { background: var(--primary); border-color: var(--primary); color: #0f1115; }
    button.primary:hover { background: #93c5fd; border-color: #93c5fd; }
    button.danger { color: var(--danger); border-color: var(--danger); }
    button.danger:hover { background: var(--danger-soft); }
    button.warning { color: var(--warning); border-color: var(--warning); }
    button.warning:hover { background: var(--warning-soft); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .alert {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 16px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      border: 1px solid #78350f;
      background: rgba(251, 191, 36, 0.08);
      color: #fcd34d;
    }

    .alert strong { display: block; margin-bottom: 4px; color: #fbbf24; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin: 24px 0 12px;
      font-weight: 700;
    }

    .kv {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 6px 16px;
      font-size: 13px;
    }

    .kv dt { color: var(--text-secondary); }
    .kv dd { margin: 0; word-break: break-word; }
    .mono { font-family: var(--mono); font-size: 12px; }
    .secret { color: var(--muted); font-style: italic; }

    .timeline {
      position: relative;
      padding-left: 24px;
      margin-top: 8px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      padding: 14px 0 18px 20px;
      border-left: none;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -24px;
      top: 18px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      transform: translateX(-1px);
    }

    .timeline-item.success::before { border-color: var(--success); background: var(--success); }
    .timeline-item.unknown::before { border-color: var(--warning); background: var(--warning); }
    .timeline-item.failed::before { border-color: var(--danger); background: var(--danger); }
    .timeline-item.muted::before { border-color: var(--muted); background: var(--surface); }
    .timeline-item.action::before { border-color: var(--primary); background: var(--primary); }

    .timeline-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .timeline-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .timeline-body {
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.6;
    }

    .timeline-body .fact {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      margin: 2px 4px 2px 0;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      Rollerskate Local UI · Trace
    </div>
    <div class="runtime-bar">
      <span>Runtime <strong>v0.3.0-demo</strong></span>
      <span>Workspace <strong>/workspace/rollerskate</strong></span>
      <span>Room loop <strong style="color:var(--success)">running</strong></span>
      <span>Worker <strong style="color:var(--success)">running</strong></span>
      <span>UI <strong>127.0.0.1:4300</strong></span>
      <span>Source <strong style="color:var(--success)">ticktick-v1</strong></span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main">
      <div class="empty">选择一个 Subscription 查看追踪时间线</div>
    </main>

        predicate: { field: "status", op: "eq", value: "completed" },
        continuationPrompt: "Bug 修复后，在 Room 中更新进展。",
        continuationTarget: { adapter: "matrix-room", destination: "!room-bugs:example.com", threadId: "thread-7" },
        grant: { id: "grant-task-read-002", paths: ["ticktick:task:read"], expiresAt: "2026-08-22T00:00:00Z", valid: true },
        budget: { maxContinuations: 1, used: 0 },
        once: true,
        expiry: "2026-08-22T00:00:00Z",
        createdAt: "2026-07-20T16:45:00Z",
        updatedAt: "2026-07-21T08:30:00Z",
        latestEvent: null,
        latestDecision: null,
        latestInvocation: null,
        latestDelivery: null
      },
      {
        id: "sub-77e3c5a0",
        status: "running",
        ownerAgent: { id: "agent-1", name: "alice", client: "codex" },
        createdByInvocation: "inv-7d3c",
        roomId: "room-planning",
        sessionId: "sess-1111-2222",
        workspace: "/workspace/planning",
        objectRef: { source: "ticktick", objectType: "task", objectId: "task-5521", sourceVersion: "v1" },

        latestEvent: { eventId: "evt-ticktick-3300-5", version: "5", occurredAt: "2026-07-20T09:00:00Z", facts: { status: "completed" } },

        latestInvocation: { invocationId: "inv-44bb", startedAt: "2026-07-20T09:00:05Z", finishedAt: "2026-07-20T09:10:00Z" },
        latestDelivery: { deliveryId: "del-88aa", deliveredAt: "2026-07-20T09:10:02Z", destination: "!room-deploy:example.com" }
      },
      {
        id: "sub-cc4433aa",
        status: "unknown",
        ownerAgent: { id: "agent-1", name: "alice", client: "codex" },
        createdByInvocation: "inv-7d3c",
        roomId: "room-planning",
        sessionId: "sess-1111-2222",
        workspace: "/workspace/planning",
        objectRef: { source: "ticktick", objectType: "task", objectId: "task-7766", sourceVersion: "v1" },
        predicate: { field: "status", op: "eq", value: "completed" },
        continuationPrompt: "任务完成后，总结当前 Room 上下文并给出下一步建议。",
        continuationTarget: { adapter: "matrix-room", destination: "!room-planning:example.com", threadId: "thread-42" },
        grant: { id: "grant-task-read-005", paths: ["ticktick:task:read"], expiresAt: "2026-08-22T00:00:00Z", valid: true },
        budget: { maxContinuations: 1, used: 1 },
        once: true,
        expiry: "2026-08-22T00:00:00Z",
        createdAt: "2026-07-21T06:00:00Z",
        updatedAt: "2026-07-21T09:50:00Z",
        latestEvent: { eventId: "evt-ticktick-7766-2", version: "2", occurredAt: "2026-07-21T09:45:00Z", facts: { status: "completed" } },
        latestDecision: { matched: true, reason: "status == completed" },
        latestInvocation: { invocationId: "inv-9f0e", startedAt: "2026-07-21T09:45:05Z", finishedAt: null },
        latestDelivery: null
      },
      {
        id: "sub-55ff1122",
        status: "cancelled",
        ownerAgent: { id: "agent-2", name: "bob", client: "codex" },
        createdByInvocation: "inv-9a1b",
        roomId: "room-bugs",
        sessionId: "sess-3333-4444",
        workspace: "/workspace/bugs",
        objectRef: { source: "ticktick", objectType: "task", objectId: "task-6655", sourceVersion: "v1" },
        predicate: { field: "status", op: "eq", value: "completed" },
        continuationPrompt: "任务取消后不再续接。",
        continuationTarget: { adapter: "matrix-room", destination: "!room-bugs:example.com", threadId: "thread-7" },
        grant: { id: "grant-task-read-006", paths: ["ticktick:task:read"], expiresAt: "2026-08-22T00:00:00Z", valid: false },
        budget: { maxContinuations: 1, used: 0 },
        once: true,
        expiry: "2026-08-22T00:00:00Z",
        createdAt: "2026-07-18T11:00:00Z",
        updatedAt: "2026-07-19T10:20:00Z",
        latestEvent: null,
        latestDecision: null,
        latestInvocation: null,
        latestDelivery: null
      }
    ];

    let subscriptions = [...MOCK_SUBSCRIPTIONS];
    let selectedId = subscriptions[0].id;

    function formatTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString("zh-CN", { hour12: false });
    }

    function badge(status) {
      const meta = STATUS_META[status] || STATUS_META.active;
      return `<span class="badge ${meta.class}">${meta.label}</span>`;
    }

    function renderSidebar() {
      const el = document.getElementById("sidebar");
      el.innerHTML = subscriptions.map(sub => `
        <div class="subscription-row ${sub.id === selectedId ? "active" : ""}" data-id="${sub.id}">
          <div class="row-header">
            <div class="row-id">${sub.id}</div>
            ${badge(sub.status)}
          </div>
          <div class="row-title">${sub.ownerAgent.name} · ${sub.objectRef.objectType}/${sub.objectRef.objectId}</div>
          <div class="row-meta">${sub.continuationTarget.adapter} → ${sub.continuationTarget.destination}</div>
        </div>
      `).join("");

      el.querySelectorAll(".subscription-row").forEach(row => {
        row.addEventListener("click", () => {
          selectedId = row.dataset.id;
          renderSidebar();
          renderMain();
        });
      });
    }

    function renderMain() {
      const el = document.getElementById("main");
      const sub = subscriptions.find(s => s.id === selectedId);
      if (!sub) {
        el.innerHTML = `<div class="empty">选择一个 Subscription 查看追踪时间线</div>`;
        return;
      }

      const isUnknown = sub.status === "unknown";
      const canPause = sub.status === "active" || sub.status === "triggered";
      const canResume = sub.status === "paused";
      const canCancel = ["active", "paused", "triggered"].includes(sub.status);
      const canRevoke = ["active", "paused", "triggered", "running", "unknown"].includes(sub.status);
      const canReconcile = sub.status === "unknown";

      const timelineNodes = [];

      timelineNodes.push({
        time: formatTime(sub.createdAt),
        title: "Subscription created",
        body: `Owner ${sub.ownerAgent.name} in Room ${sub.roomId} · Session ${sub.sessionId} · one-shot`,
        cls: "success"
      });

      if (sub.latestEvent) {
        timelineNodes.push({
          time: formatTime(sub.latestEvent.occurredAt),
          title: "Object Event observed",
          body: `Event <span class="mono">${sub.latestEvent.eventId}</span> · version ${sub.latestEvent.version}` +
            Object.entries(sub.latestEvent.facts).map(([k, v]) => `<span class="fact">${k}=${v}</span>`).join(""),
          cls: "success"
        });
      } else {
        timelineNodes.push({
          time: "—",
          title: "Object Event observed",
          body: "尚未观察到目标对象变化",
          cls: "muted"
        });
      }

      if (sub.latestDecision) {
        timelineNodes.push({
          time: sub.latestEvent ? formatTime(sub.latestEvent.occurredAt) : "—",
          title: "Predicate matched",
          body: `Reason: ${sub.latestDecision.reason}`,
          cls: sub.latestDecision.matched ? "success" : "failed"
        });
      } else {
        timelineNodes.push({
          time: "—",
          title: "Predicate matched",
          body: "尚未匹配",
          cls: "muted"
        });
      }

      if (sub.latestInvocation) {
        timelineNodes.push({
          time: formatTime(sub.latestInvocation.startedAt),
          title: "Provider invoked",
          body: `Invocation <span class="mono">${sub.latestInvocation.invocationId}</span>` +
            (sub.latestInvocation.finishedAt ? ` · finished ${formatTime(sub.latestInvocation.finishedAt)}` : " · still running"),
          cls: sub.latestInvocation.finishedAt ? "success" : "unknown"
        });
      } else {
        timelineNodes.push({
          time: "—",
          title: "Provider invoked",
          body: "尚未启动 continuation",
          cls: "muted"
        });
      }

      if (sub.latestDelivery) {
        timelineNodes.push({
          time: formatTime(sub.latestDelivery.deliveredAt),
          title: "Delivery receipt",
          body: `Receipt <span class="mono">${sub.latestDelivery.deliveryId}</span> · destination ${sub.latestDelivery.destination}`,
          cls: "success"
        });
      } else if (isUnknown) {
        timelineNodes.push({
          time: formatTime(sub.updatedAt),
          title: "Delivery receipt unknown",
          body: "Provider 已执行，但 durable receipt 未确认；禁止自动重放",
          cls: "unknown"
        });
      } else if (["failed", "cancelled", "revoked", "expired"].includes(sub.status)) {
        timelineNodes.push({
          time: formatTime(sub.updatedAt),
          title: `Terminated: ${sub.status}`,
          body: "Subscription 进入终态，不再自动执行",
          cls: "failed"
        });
      } else {
        timelineNodes.push({
          time: "—",
          title: "Delivery receipt",
          body: "等待 provider 结果",
          cls: "muted"
        });
      }

      const governanceNodes = [];
      if (sub.status === "paused") {
        governanceNodes.push({ time: formatTime(sub.updatedAt), title: "Paused by user", body: "Subscription 被暂停，新 Event 不会触发续接", cls: "action" });
      }
      if (sub.status === "cancelled") {
        governanceNodes.push({ time: formatTime(sub.updatedAt), title: "Cancelled by user", body: "Subscription 被取消", cls: "action" });
      }
      if (sub.status === "revoked") {
        governanceNodes.push({ time: formatTime(sub.updatedAt), title: "Revoked by user", body: "关联 grant 已撤销", cls: "action" });
      }

      el.innerHTML = `
        ${isUnknown ? `
          <div class="alert">
            <div>
              <strong>需要人工处理：provider 执行结果未知</strong>
              <div>该 Subscription 已触发并调用了 Agent，但 delivery receipt 尚未确认。系统在收到明确结果前不会自动重放。请检查目标 Room/Codex Desktop task，然后选择 reconcile。</div>
            </div>
          </div>
        ` : ""}

        <div class="panel-header">
          <div>
            <div class="panel-title">${sub.id}</div>
            <div class="panel-subtitle">${sub.ownerAgent.name} · ${sub.objectRef.source}/${sub.objectRef.objectType}/${sub.objectRef.objectId} · ${badge(sub.status)}</div>
          </div>
          <div class="actions">
            <button class="primary" ${!canPause ? "disabled" : ""} onclick="act('pause')">Pause</button>
            <button ${!canResume ? "disabled" : ""} onclick="act('resume')">Resume</button>
            <button class="warning" ${!canCancel ? "disabled" : ""} onclick="act('cancel')">Cancel</button>
            <button class="danger" ${!canRevoke ? "disabled" : ""} onclick="act('revoke')">Revoke</button>
            ${canReconcile ? `<button class="warning" onclick="act('reconcile')">Reconcile</button>` : ""}
          </div>
        </div>

        <div class="kv">
          <dt>ObjectRef</dt>
          <dd class="mono">${sub.objectRef.source}/${sub.objectRef.objectType}/${sub.objectRef.objectId} @ ${sub.objectRef.sourceVersion}</dd>
          <dt>Predicate</dt>
          <dd class="mono">${sub.predicate.field} ${sub.predicate.op} "${sub.predicate.value}"</dd>
          <dt>Continuation target</dt>
          <dd>${sub.continuationTarget.adapter} → <span class="mono">${sub.continuationTarget.destination}</span> ${sub.continuationTarget.threadId ? `(thread ${sub.continuationTarget.threadId})` : ""}</dd>
          <dt>Grant</dt>
          <dd class="mono">${sub.grant.id} · ${sub.grant.paths.join(", ")} · ${sub.grant.valid ? "valid" : "invalid"}</dd>
          <dt>Secret</dt>
          <dd><span class="secret">••••••••</span></dd>
          <dt>Budget</dt>
          <dd>${sub.budget.used} / ${sub.budget.maxContinuations}</dd>
          <dt>Expiry</dt>
          <dd>${formatTime(sub.expiry)}</dd>
        </div>

        <div class="section-title">Execution Trace</div>
        <div class="timeline">
          ${timelineNodes.map(n => `
            <div class="timeline-item ${n.cls}">
              <div class="timeline-time">${n.time}</div>
              <div>
                <div class="timeline-title">${n.title}</div>
                <div class="timeline-body">${n.body}</div>
              </div>
            </div>
          `).join("")}
        </div>

        ${governanceNodes.length ? `
          <div class="section-title">Governance Events</div>
          <div class="timeline">
            ${governanceNodes.map(n => `
              <div class="timeline-item ${n.cls}">
                <div class="timeline-time">${n.time}</div>
                <div>
                  <div class="timeline-title">${n.title}</div>
                  <div class="timeline-body">${n.body}</div>
                </div>
              </div>
            `).join("")}
          </div>
        ` : ""}
      `;
    }

    window.act = function (action) {
      const sub = subscriptions.find(s => s.id === selectedId);
      if (!sub) return;

      const now = new Date().toISOString();
      if (action === "pause" && sub.status === "active") {
        sub.status = "paused";
        sub.updatedAt = now;
      } else if (action === "resume" && sub.status === "paused") {
        sub.status = "active";
        sub.updatedAt = now;
      } else if (action === "cancel") {
        sub.status = "cancelled";
        sub.updatedAt = now;
      } else if (action === "revoke") {
        sub.status = "revoked";
        sub.grant.valid = false;
        sub.updatedAt = now;
      } else if (action === "reconcile" && sub.status === "unknown") {
        sub.status = "completed";
        sub.latestDelivery = {
          deliveryId: "del-reconciled-" + Math.random().toString(36).slice(2, 8),
          deliveredAt: now,
          destination: sub.continuationTarget.destination
        };
        sub.latestInvocation = { ...sub.latestInvocation, finishedAt: now };
        sub.updatedAt = now;
      }

      renderSidebar();
      renderMain();
    };

    renderSidebar();
    renderMain();
  </script>
</body>
</html>
