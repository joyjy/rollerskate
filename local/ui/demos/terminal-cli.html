<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollerskate Local UI · Terminal</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --surface: #151515;
      --surface-2: #1e1e1e;
      --text: #d4d4d4;
      --text-secondary: #858585;
      --text-dim: #555555;
      --border: #2a2a2a;
      --green: #4ec9b0;
      --green-soft: rgba(78, 201, 176, 0.12);
      --yellow: #dcdcaa;
      --yellow-soft: rgba(220, 220, 170, 0.12);
      --red: #f44747;
      --red-soft: rgba(244, 71, 71, 0.12);
      --blue: #569cd6;
      --blue-soft: rgba(86, 156, 214, 0.12);
      --magenta: #c586c0;
      --cyan: #4fc1ff;
      --radius: 4px;
      --mono: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.6;
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr 320px;
      height: 100vh;
      overflow: hidden;
    }

    .panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel:last-child { border-right: none; }

    .panel-header {
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 11px;
    }

    .list-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .list-item {
      padding: 8px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }

    .list-item:hover { background: var(--surface-2); }
    .list-item.active {
      background: var(--surface-2);
      border-color: var(--green);
    }

    .list-id {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 2px;
    }

    .list-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .list-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .main {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .terminal {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .line { margin: 0 0 6px; white-space: pre-wrap; }
    .prompt { color: var(--green); }
    .cmd { color: var(--text); }
    .muted { color: var(--text-secondary); }
    .dim { color: var(--text-dim); }
    .ok { color: var(--green); }
    .warn { color: var(--yellow); }
    .err { color: var(--red); }
    .info { color: var(--blue); }
    .accent { color: var(--magenta); }
    .cyan { color: var(--cyan); }

    .key { color: var(--blue); }
    .value { color: var(--text); }
    .string { color: var(--green); }

    .status-bar {
      padding: 8px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 12px;
      display: flex;
      gap: 20px;
      color: var(--text-secondary);
    }

    .status-bar span strong { color: var(--text); }

    .inspector {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .inspector-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .section-title {
      color: var(--text-dim);
      margin: 16px 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-title:first-child { margin-top: 0; }

    .kv {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 4px 10px;
      font-size: 12px;
    }

    .kv dt { color: var(--text-dim); }
    .kv dd { margin: 0; word-break: break-word; }

    .secret { color: var(--text-dim); }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      appearance: none;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover { background: var(--surface); border-color: var(--green); }
    button:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--border); }
    button.primary { border-color: var(--green); color: var(--green); }
    button.primary:hover { background: var(--green-soft); }
    button.danger { border-color: var(--red); color: var(--red); }
    button.danger:hover { background: var(--red-soft); }
    button.warning { border-color: var(--yellow); color: var(--yellow); }
    button.warning:hover { background: var(--yellow-soft); }

    .log-entry {
      margin-bottom: 8px;
    }

    .log-entry .timestamp {
      color: var(--text-dim);
      font-size: 11px;
    }

    .tag {
      display: inline-block;
      padding: 0 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      margin-right: 6px;
    }

    .tag.active { background: var(--green-soft); color: var(--green); }
    .tag.paused { background: var(--surface-2); color: var(--text-secondary); }
    .tag.triggered { background: var(--yellow-soft); color: var(--yellow); }
    .tag.running { background: var(--blue-soft); color: var(--blue); }
    .tag.completed { background: var(--green-soft); color: var(--green); }
    .tag.failed { background: var(--red-soft); color: var(--red); }
    .tag.unknown { background: var(--yellow-soft); color: var(--yellow); outline: 1px dashed var(--yellow); }
    .tag.cancelled { background: var(--surface-2); color: var(--text-secondary); }
    .tag.expired { background: var(--surface-2); color: var(--text-secondary); }
    .tag.revoked { background: var(--red-soft); color: var(--red); }

    @media (max-width: 1000px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
      .panel { border-right: none; border-bottom: 1px solid var(--border); }
      .panel:last-child { border-bottom: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="panel-header">Subscriptions</div>
      <div class="list-body" id="listBody"></div>
    </div>

    <div class="main">
      <div class="terminal" id="terminal"></div>
      <div class="status-bar">
        <span>Runtime <strong>v0.3.0-demo</strong></span>
        <span>Room loop <strong class="ok">running</strong></span>
        <span>Worker <strong class="ok">running</strong></span>
        <span>UI <strong>127.0.0.1:4300</strong></span>
        <span>Source <strong class="ok">ticktick-v1</strong></span>
      </div>
    </div>

    <div class="panel inspector">
      <div class="panel-header">Inspector</div>
      <div class="inspector-body" id="inspector"></div>
    </div>
  </div>

        latestDelivery: null
      },
      {
        id: "sub-55ff1122",
        status: "cancelled",
        ownerAgent: { id: "agent-2", name: "bob", client: "codex" },
        createdByInvocation: "inv-9a1b",
        roomId: "room-bugs",
        sessionId: "sess-3333-4444",
        workspace: "/workspace/bugs",
        objectRef: { source: "ticktick", objectType: "task", objectId: "task-6655", sourceVersion: "v1" },
        predicate: { field: "status", op: "eq", value: "completed" },
        continuationPrompt: "任务取消后不再续接。",
        continuationTarget: { adapter: "matrix-room", destination: "!room-bugs:example.com", threadId: "thread-7" },
        grant: { id: "grant-task-read-006", paths: ["ticktick:task:read"], expiresAt: "2026-08-22T00:00:00Z", valid: false },
        budget: { maxContinuations: 1, used: 0 },
        once: true,

        latestDecision: null,

        latestDelivery: null
      }

    let subscriptions = [...MOCK_SUBSCRIPTIONS];
    let selectedId = subscriptions[0].id;
    const logs = [];

    function formatTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString("zh-CN", { hour12: false });
    }

    function tag(status) {
      const meta = STATUS_META[status] || STATUS_META.active;
      return `<span class="tag ${meta.class}">${meta.label}</span>`;
    }

    function log(text, type = "info") {
      const now = new Date().toLocaleTimeString("zh-CN", { hour12: false });
      const cls = type === "ok" ? "ok" : type === "warn" ? "warn" : type === "err" ? "err" : type === "accent" ? "accent" : "info";
      logs.push(`<span class="timestamp">[${now}]</span> <span class="${cls}">${text}</span>`);
      renderTerminal();
    }

    function renderList() {
      const el = document.getElementById("listBody");
      el.innerHTML = subscriptions.map(sub => `
        <div class="list-item ${sub.id === selectedId ? "active" : ""}" data-id="${sub.id}">
          <div class="list-id">${sub.id}</div>
          <div class="list-title">${tag(sub.status)} ${sub.ownerAgent.name}</div>
          <div class="list-meta">${sub.objectRef.objectId} → ${sub.continuationTarget.adapter}</div>
        </div>
      `).join("");

      el.querySelectorAll(".list-item").forEach(item => {
        item.addEventListener("click", () => {
          selectedId = item.dataset.id;
          renderList();
          renderTerminal();
          renderInspector();
        });
      });
    }

    function renderTerminal() {
      const el = document.getElementById("terminal");
      const sub = subscriptions.find(s => s.id === selectedId);
      if (!sub) return;

      const lines = [
        `<span class="prompt">rollerskate</span>:<span class="accent">ui</span>$ inspect ${sub.id}`,
        "",
        `<span class="key">subscription_id:</span> <span class="value">${sub.id}</span>`,
        `<span class="key">status:</span>        ${tag(sub.status)}`,
        `<span class="key">owner:</span>         ${sub.ownerAgent.name} (${sub.ownerAgent.client})`,
        `<span class="key">room:</span>          ${sub.roomId}`,
        `<span class="key">session:</span>       ${sub.sessionId}`,
        `<span class="key">workspace:</span>     ${sub.workspace}`,
        `<span class="key">once:</span>           ${sub.once}`,
        `<span class="key">expiry:</span>        ${formatTime(sub.expiry)}`,
        "",
        `<span class="key">object_ref:</span>`,
        `  source:       <span class="string">${sub.objectRef.source}</span>`,
        `  object_type:  <span class="string">${sub.objectRef.objectType}</span>`,
        `  object_id:    <span class="string">${sub.objectRef.objectId}</span>`,
        `  version:      <span class="string">${sub.objectRef.sourceVersion}</span>`,
        `predicate:`,
        `  <span class="cyan">${sub.predicate.field}</span> ${sub.predicate.op} <span class="string">"${sub.predicate.value}"</span>`,
        "",
        `<span class="key">continuation_target:</span>`,
        `  adapter:      <span class="string">${sub.continuationTarget.adapter}</span>`,
        `  destination:  <span class="string">${sub.continuationTarget.destination}</span>`,
        `  thread:       ${sub.continuationTarget.threadId ?? "<span class=\"dim\">null</span>"}`,
        `  prompt:       <span class="string">${sub.continuationPrompt}</span>`,
        "",
        `<span class="key">authority:</span>`,
        `  grant:        ${sub.grant.id}`,
        `  paths:        [${sub.grant.paths.map(p => `<span class="string">${p}</span>`).join(", ")}]`,
        `  valid:        ${sub.grant.valid ? "<span class=\"ok\">true</span>" : "<span class=\"err\">false</span>"}`,
        `  secret:       <span class="secret">••••••••</span>`,
        `  budget:       ${sub.budget.used} / ${sub.budget.maxContinuations}`,
        "",
        `<span class="key">latest_event:</span>     ${sub.latestEvent ? `<span class="ok">${sub.latestEvent.eventId} v${sub.latestEvent.version}</span>` : "<span class=\"dim\">none</span>"}`,
        `<span class="key">latest_decision:</span>  ${sub.latestDecision ? `<span class="ok">matched: ${sub.latestDecision.reason}</span>` : "<span class=\"dim\">none</span>"}`,
        `<span class="key">latest_invocation:</span> ${sub.latestInvocation ? `<span class="ok">${sub.latestInvocation.invocationId}</span>` : "<span class=\"dim\">none</span>"}`,
        `<span class="key">latest_delivery:</span>  ${sub.latestDelivery ? `<span class="ok">${sub.latestDelivery.deliveryId}</span>` : "<span class=\"dim\">none</span>"}`,
        ""
      ];

      if (sub.status === "unknown") {
        lines.push(
          `<span class="warn">WARNING:</span> provider result unknown; automatic replay disabled.`,
          `<span class="warn">ACTION:</span>  inspect destination, then run reconcile.`,
          ""
        );
      }

      const logTail = logs.slice(-20);
      el.innerHTML = [...lines, ...logTail].map(line => `<div class="line">${line}</div>`).join("");
      el.scrollTop = el.scrollHeight;
    }

    function renderInspector() {
      const el = document.getElementById("inspector");
      const sub = subscriptions.find(s => s.id === selectedId);
      if (!sub) return;

      const isUnknown = sub.status === "unknown";
      const canPause = sub.status === "active" || sub.status === "triggered";
      const canResume = sub.status === "paused";
      const canCancel = ["active", "paused", "triggered"].includes(sub.status);
      const canRevoke = ["active", "paused", "triggered", "running", "unknown"].includes(sub.status);
      const canReconcile = sub.status === "unknown";

      el.innerHTML = `
        <div class="section-title">Actions</div>
        <div class="btn-group">
          <button class="primary" ${!canPause ? "disabled" : ""} onclick="act('pause')">$ rs sub pause ${sub.id}</button>
          <button ${!canResume ? "disabled" : ""} onclick="act('resume')">$ rs sub resume ${sub.id}</button>
          <button class="warning" ${!canCancel ? "disabled" : ""} onclick="act('cancel')">$ rs sub cancel ${sub.id}</button>
          <button class="danger" ${!canRevoke ? "disabled" : ""} onclick="act('revoke')">$ rs sub revoke ${sub.id}</button>
          ${canReconcile ? `<button class="warning" onclick="act('reconcile')">$ rs sub reconcile ${sub.id}</button>` : ""}
        </div>

        <div class="section-title">Summary</div>
        <div class="kv">
          <dt>ID</dt><dd>${sub.id}</dd>
          <dt>Status</dt><dd>${tag(sub.status)}</dd>
          <dt>Agent</dt><dd>${sub.ownerAgent.name}</dd>
          <dt>Object</dt><dd>${sub.objectRef.objectId}</dd>
          <dt>Target</dt><dd>${sub.continuationTarget.adapter}</dd>
          <dt>Updated</dt><dd>${formatTime(sub.updatedAt)}</dd>
        </div>

        ${isUnknown ? `
          <div class="section-title">Needs Attention</div>
          <div class="warn">Provider 已执行但 receipt 未确认。请检查目标 destination，然后 reconcile。</div>
        ` : ""}
      `;
    }

    window.act = function (action) {
      const sub = subscriptions.find(s => s.id === selectedId);
      if (!sub) return;

      const now = new Date().toISOString();
      if (action === "pause" && sub.status === "active") {
        sub.status = "paused";
        sub.updatedAt = now;
        log(`Paused subscription ${sub.id}`, "accent");
      } else if (action === "resume" && sub.status === "paused") {
        sub.status = "active";
        sub.updatedAt = now;
        log(`Resumed subscription ${sub.id}`, "ok");
      } else if (action === "cancel") {
        sub.status = "cancelled";
        sub.updatedAt = now;
        log(`Cancelled subscription ${sub.id}`, "warn");
      } else if (action === "revoke") {
        sub.status = "revoked";
        sub.grant.valid = false;
        sub.updatedAt = now;
        log(`Revoked subscription ${sub.id}`, "err");
      } else if (action === "reconcile" && sub.status === "unknown") {
        sub.status = "completed";
        sub.latestDelivery = {
          deliveryId: "del-reconciled-" + Math.random().toString(36).slice(2, 8),
          deliveredAt: now,
          destination: sub.continuationTarget.destination
        };
        sub.latestInvocation = { ...sub.latestInvocation, finishedAt: now };
        sub.updatedAt = now;
        log(`Reconciled subscription ${sub.id} → completed`, "ok");
      }

      renderList();
      renderTerminal();
      renderInspector();
    };

    renderList();
    renderTerminal();
    renderInspector();
  </script>
</body>
</html>
